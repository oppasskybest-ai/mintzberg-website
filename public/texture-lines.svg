  <defs>
    <pattern id="diag" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1a2e4a" stroke-width="1" stroke-opacity="0.08" />
      <line x1="20" y1="0" x2="20" y2="40" stroke="#1a2e4a" stroke-width="1" stroke-opacity="0.045" />
    </pattern>
